<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Current Projects — Krown Properties</title>
  <meta name="description" content="Explore Krown Properties' current residential development portfolio across Auckland — from boutique townhouses to large-scale communities." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://krownproperties.co.nz/currentProjects.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Current Projects — Krown Properties" />
  <meta property="og:description" content="Explore Krown Properties' current residential development portfolio across Auckland — from boutique townhouses to large-scale communities." />
  <meta property="og:url" content="https://krownproperties.co.nz/currentProjects.html" />
  <meta property="og:image" content="https://krownproperties.co.nz/img/86-taylor-street/86TaylorStreet_exterior1.jpg" />
  <meta property="og:site_name" content="Krown Properties" />
  <meta name="twitter:card" content="summary_large_image" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- Header and Nav injected by components.js -->
<div id="kp-header"></div>

<!-- CURRENT PROJECTS PAGE WRAPPER -->
<div id="current-projects-page">

  <!-- Hero -->
  <section class="cp-hero" id="cpHero" aria-label="Current projects hero">
    <div class="cp-hero-bg" role="img" aria-label="Krown Properties residential development"></div>
    <div class="cp-hero-overlay"></div>
    <div class="cp-hero-content">
      <p class="cp-hero-label">Our Portfolio</p>
      <h1 class="cp-hero-title">Current<br>Projects</h1>
    </div>
  </section>

  <!-- Projects Grid — rendered dynamically from PROJECTS data -->
  <div class="hfs-section">
    <div class="cp-layout">
      <div class="hfs-grid" id="cpProjectsList"></div>
    </div>
  </div>

  <!-- Footer -->
  <div id="kp-footer"></div>

</div><!-- #current-projects-page -->

<script src="js/components.js"></script>
<script src="js/projects-data.js"></script>
<script>
  // Render current projects as a 3-column card grid
  (function renderProjects() {
    var container = document.getElementById('cpProjectsList');
    if (!container || typeof PROJECTS === 'undefined') return;

    var ARR_ICON = '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

    var entries = Object.entries(PROJECTS);

    container.innerHTML = entries.map(function (entry, i) {
      var key = entry[0], p = entry[1];
      var imgSrc = (p.images && p.images[0]) ? p.images[0] : p.cardImage;
      var delay = (i % 3) * 0.1;
      var cat = p.category || 'Current Projects';
      return '<div class="hfs-card" data-category="' + cat + '" style="transition-delay:' + delay + 's">' +
        '<div class="hfs-card-img-wrap">' +
          '<img src="' + imgSrc + '" alt="' + p.name + '" loading="lazy" />' +
          '<span class="project-status hfs-card-badge ' + p.statusClass + '">' + p.statusLabel + '</span>' +
        '</div>' +
        '<div class="hfs-card-body">' +
          '<p class="hfs-card-category">' + cat + '</p>' +
          '<h2 class="hfs-card-name">' + p.name + '</h2>' +
          '<p class="hfs-card-location">' + p.location + '</p>' +
          '<p class="hfs-card-desc">' + p.cardDesc + '</p>' +
          '<a href="project?id=' + key + '" class="hfs-card-btn">Learn More ' + ARR_ICON + '</a>' +
        '</div>' +
      '</div>';
    }).join('\n');

    // Update sidebar counts
    var nav = document.getElementById('cpSidebarNav');
    if (nav) {
      var allCards = Array.from(container.querySelectorAll('.hfs-card'));
      nav.querySelectorAll('.cp-sidebar-btn').forEach(function (btn) {
        var filter = btn.dataset.filter;
        var count = filter === 'all' ? allCards.length : allCards.filter(function (c) { return c.dataset.category === filter; }).length;
        var span = btn.querySelector('.cp-sidebar-count');
        if (span) span.textContent = count;
      });

      // Filter on click
      nav.addEventListener('click', function (e) {
        var btn = e.target.closest('.cp-sidebar-btn');
        if (!btn) return;
        nav.querySelectorAll('.cp-sidebar-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var filter = btn.dataset.filter;
        allCards.forEach(function (card) {
          var match = filter === 'all' || card.dataset.category === filter;
          card.classList.toggle('hidden', !match);
        });
      });
    }

    // Scroll reveal
    var cards = Array.from(container.querySelectorAll('.hfs-card'));
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
    cards.forEach(function (el) { io.observe(el); });
  })();
</script>
<script src="js/script.js"></script>
<script>
  // Activate this page and trigger hero animation
  (function() {
    var wrapper = document.getElementById('current-projects-page');
    if (!wrapper) return;
    wrapper.style.display = 'block';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        wrapper.classList.add('page-active');
        setTimeout(function() {
          var hero = document.getElementById('cpHero');
          if (hero) hero.classList.add('loaded');
        }, 100);
      });
    });
  })();
</script>
</body>
</html>
