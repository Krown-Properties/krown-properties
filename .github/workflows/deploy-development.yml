name: Deploy to Development (Netlify)

on:
  # Auto-deploy when code is pushed to dev
  push:
    branches:
      - dev

  # Manual deploy from GitHub UI
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual dev deployment'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Netlify Development
        uses: nwtgck/actions-netlify@v2.1
        with:
          publish-dir: '.'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: |
            Dev Deploy: ${{ github.event.head_commit.message || github.event.inputs.reason }}
            Commit: ${{ github.sha }}
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_DEV }}
        timeout-minutes: 5

      - name: Deployment Success
        if: success()
        run: |
          echo "Deployed to Development!"
          echo "URL: https://krown-properties-dev.netlify.app"
