name: Promote Development to Production

on:
  workflow_dispatch:
    inputs:
      merge_method:
        description: 'Merge method'
        required: true
        default: 'squash'
        type: choice
        options:
          - merge
          - squash
      reason:
        description: 'Reason for promotion'
        required: false
        default: 'Promoting tested changes to production'

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install gh -y

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Fetch branches
        run: git fetch origin main github

      - name: Check for differences
        id: check
        run: |
          if git diff --quiet origin/main origin/github; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No changes to promote"
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head github \
            --title "Promote github to main" \
            --body "${{ github.event.inputs.reason }}"

      - name: Merge Pull Request
        if: steps.check.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge github \
            --${{ github.event.inputs.merge_method }} \
            --delete-branch=false

      - name: No changes
        if: steps.check.outputs.no_changes == 'true'
        run: echo "Branches are already in sync"
